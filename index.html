<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title></title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa}
.loading{display:flex;justify-content:center;align-items:center;min-height:100vh;font-size:16px;color:#666}
.error{text-align:center;padding:40px 20px;color:#999}
</style>
</head>
<body>
<div id="app" class="loading">加载中...</div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const app = document.getElementById('app');

  const COS_BASE = 'https://qrmedia-1505800238.cos.ap-guangzhou.myqcloud.com';

  function render(mediaUrl, type) {
    type = type || 'auto';
    function detectType(url) {
      const ext = url.split('.').pop().toLowerCase().split('?')[0];
      if (['jpg','jpeg','png','gif','webp','bmp','svg'].includes(ext)) return 'image';
      if (['mp4','avi','mov','wmv','flv','mkv','webm'].includes(ext)) return 'video';
      if (['mp3','wav','aac','ogg','wma','flac','m4a'].includes(ext)) return 'audio';
      if (ext === 'pdf') return 'pdf';
      if (ext === 'html' || ext === 'htm') return 'html';
      return 'other';
    }
    const mediaType = type === 'auto' ? detectType(mediaUrl) : type;
    const fileName = mediaUrl.split('/').pop().split('?')[0];
    let html = '';
    if (mediaType === 'image') {
      html = '<div style="background:#000;min-height:100vh;display:flex;justify-content:center;align-items:center"><img src="' + mediaUrl + '" style="max-width:100%;max-height:100vh;object-fit:contain" alt="' + fileName + '"></div>';
    } else if (mediaType === 'video') {
      html = '<div style="background:#000;min-height:100vh;display:flex;justify-content:center;align-items:center"><video src="' + mediaUrl + '" controls autoplay playsinline webkit-playsinline style="max-width:100%;max-height:100vh;width:100%"></video></div>';
    } else if (mediaType === 'audio') {
      html = '<div style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center"><div style="background:rgba(255,255,255,.96);border-radius:24px;padding:36px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:380px;width:90%"><div style="font-size:52px;margin-bottom:12px"></div><div style="color:#333;font-size:16px;font-weight:600;margin-bottom:20px;word-break:break-all">' + fileName + '</div><audio src="' + mediaUrl + '" controls autoplay style="width:100%;border-radius:8px"></audio></div></div>';
    } else if (mediaType === 'pdf') {
      html = '<iframe src="' + mediaUrl + '" style="width:100%;height:100vh;border:none;position:fixed;top:0;left:0"></iframe>';
    } else if (mediaType === 'html') {
      html = '<iframe src="' + mediaUrl + '" style="width:100%;height:100vh;border:none;position:fixed;top:0;left:0"></iframe>';
    } else {
      html = '<div style="padding:20px;text-align:center;background:#f5f7fa;min-height:100vh"><div style="background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.08);max-width:400px;margin:40px auto"><div style="font-size:48px;margin-bottom:16px">📄</div><div style="font-size:16px;color:#333;margin-bottom:8px;word-break:break-all">' + fileName + '</div><a href="' + mediaUrl + '" style="display:inline-block;padding:12px 32px;background:#667eea;color:#fff;text-decoration:none;border-radius:8px;font-size:14px" target="_blank">打开文件</a></div></div>';
    }
    app.innerHTML = html;
    app.className = '';
  }

  const liveId = params.get('live');
  if (liveId) {
    const script = document.createElement('script');
    script.src = COS_BASE + '/_live_config.js?t=' + Date.now();
    script.onload = function() {
      if (typeof LIVE_CONFIG !== 'undefined' && LIVE_CONFIG[liveId]) {
        render(LIVE_CONFIG[liveId].url, params.get('type'));
      } else {
        app.className = 'error';
        app.innerHTML = '<p>活码不存在或已被删除</p>';
      }
    };
    script.onerror = function() {
      app.className = 'error';
      app.innerHTML = '<p>加载失败，请检查网络</p>';
    };
    document.head.appendChild(script);
    return;
  }

  const mediaUrl = params.get('url');
  if (!mediaUrl) {
    app.className = 'error';
    app.innerHTML = '<p>缺少媒体URL参数</p>';
    return;
  }
  render(mediaUrl, params.get('type'));
})();
</script>
</body>
</html>
